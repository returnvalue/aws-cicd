AWSTemplateFormatVersion: '2010-09-09'
Parameters:
  PipelineRoleArn: {Type: String}
  ArtifactBucket: {Type: String}
Resources:
  Pipeline:
    Type: 'AWS::CodePipeline::Pipeline'
    Properties:
      Name: WebApp-CI-CD-Pipeline
      RoleArn: !Ref PipelineRoleArn
      ArtifactStore: {Type: S3, Location: !Ref ArtifactBucket}
      Stages:
        - Name: Source
          Actions:
            - Name: SourceAction
              ActionTypeId: {Category: Source, Owner: AWS, Provider: CodeCommit, Version: '1'}
              OutputArtifacts: [{Name: SourceArtifact}]
              Configuration: {RepositoryName: portfolio-web-app, BranchName: main}
        - Name: Build
          Actions:
            - Name: BuildAction
              ActionTypeId: {Category: Build, Owner: AWS, Provider: CodeBuild, Version: '1'}
              InputArtifacts: [{Name: SourceArtifact}]
              OutputArtifacts: [{Name: BuildArtifact}]
              Configuration: {ProjectName: WebAppBuild}
        - Name: Deploy
          Actions:
            - Name: DeployAction
              ActionTypeId: {Category: Deploy, Owner: AWS, Provider: CodeDeploy, Version: '1'}
              InputArtifacts: [{Name: BuildArtifact}]
              Configuration: {ApplicationName: WebAppDeploy, DeploymentGroupName: DevDeploymentGroup}
